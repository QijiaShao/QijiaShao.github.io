- date: "08/2025"
  text: >-
    Our paper **"My Pillow Knows My Sleep: Sleep Monitoring with Computational Fabrics in the Pillowcase"** has been accepted by IMWUT/[UbiComp2025](https://www.ubicomp.org/ubicomp-iswc-2025/). Though it doesn't yet match my ideal vision, this system represents a cool and effective design for passive sleep monitoring.  We can sense your ECG and neck EMG with your pillowcase, and you won't feel a thing!  For a deeper dive, see the paper [here](https://dl.acm.org/doi/10.1145/3749550)!

