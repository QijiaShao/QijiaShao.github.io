- date: "12/2023"
  text: >-
    My internship work **"Normalization is All You Need: Robust Full-Range Contactless SpO2 Estimation Across Users"** at Samsung Research is accepted at [ICASSP 2024](https://2024.ieeeicassp.org/) as an oral presentation! We proposed a simple yet effective algorithm to handle the cross-user variation (e.g., different skin tones and ages). The proposed algorithm is an A1 patent for Samsung and now being deployed to Samsung products! Please check out our paper [here!](https://ieeexplore.ieee.org/document/10446435)

